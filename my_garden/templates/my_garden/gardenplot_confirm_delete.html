{% extends "main/base.html" %}
{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">Delete Garden Plot</h1>

  <div class="alert alert-warning">
    Are you sure you want to delete <strong>{{ object.name }}</strong>?
    <div class="small mt-2">
      Any plant logs referencing this plot will keep working, but their plot will become empty (because logs use <code>SET_NULL</code>).
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'my_garden:gardenplot_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
