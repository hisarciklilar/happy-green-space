{% extends "main/base.html" %}
{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">
    {% if object %}Edit Plant Log{% else %}Add Plant Log{% endif %}
  </h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'my_garden:plantlog_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
