{% extends "main/base.html" %}
{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">Delete Plant Log</h1>

  <div class="alert alert-warning">
    Are you sure you want to delete: <strong>{{ object.plant.name }}</strong>?
  </div>

  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'my_garden:plantlog_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
